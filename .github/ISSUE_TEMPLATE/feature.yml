name: Feature request
description: Suggest something MacExplorer should do.
labels: [enhancement, from-app]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: input
    id: version
    attributes:
      label: MacExplorer version
