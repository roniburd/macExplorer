# The setup every macOS job in ci.yml and release.yml shares, after actions/checkout: select Xcode, restore the
# SwiftPM download cache and resolve packages (retrying network errors).
name: Set up Swift
description: Select Xcode, cache SwiftPM downloads and resolve packages
inputs:
  xcode-version:
    description: Xcode version under /Applications/Xcode_<version>.app
    required: true
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        XCODE_VERSION: ${{ inputs.xcode-version }}
      run: |
        sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
        swift --version
    - name: Cache SwiftPM downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
        restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-
    - name: Resolve packages (retries network errors)
      shell: bash
      run: scripts/resolve-packages.sh
