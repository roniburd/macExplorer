<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>macExplorer — icon concepts</title>
<style>
  :root { --fg:#1d1d1f; --mut:#6e6e73; --card:#ffffff; --bg:#f2f2f5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:40px 48px 8px; }
  h1 { font:600 30px -apple-system, "SF Pro Display", sans-serif; margin:0 0 6px; letter-spacing:-.02em; }
  h2 { font:600 20px -apple-system, "SF Pro Display", sans-serif; margin:36px 48px 12px; }
  .sub { color:var(--mut); margin:0; }
  .overview { display:grid; grid-template-columns:repeat(4, 180px); gap:10px; padding:8px 48px 0; }
  .ov { text-align:center; font-size:12px; color:var(--mut); }
  .ov img { width:100%; max-width:170px; display:block; margin:0 auto 2px; }
  .ov b { color:var(--fg); font-weight:600; }
  .card { background:var(--card); margin:16px 48px; border-radius:22px; padding:22px 26px; box-shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 30px rgba(0,0,0,.05); }
  .card h3 { margin:0; font:600 18px -apple-system, "SF Pro Display", sans-serif; }
  .card h3 span { color:var(--mut); font-weight:500; margin-right:6px; }
  .card p { margin:2px 0 14px; color:var(--mut); }
  .row { display:flex; gap:18px; align-items:stretch; flex-wrap:wrap; }
  .hero { width:232px; height:232px; display:grid; place-items:center; border-radius:16px; background:radial-gradient(circle at 50% 35%, #fff, #e9e9ee); }
  .hero img { width:224px; }
  .modes { display:grid; grid-template-columns:repeat(2, 112px); gap:8px; }
  .mode { border-radius:12px; height:112px; display:grid; place-items:center; position:relative; }
  .mode img { width:84px; }
  .mode i { position:absolute; bottom:4px; left:0; right:0; text-align:center; font-style:normal; font-size:10px; letter-spacing:.04em; text-transform:uppercase; }
  .m-default { background:linear-gradient(160deg,#f7f7fa,#dcdce3); } .m-default i { color:#86868b; }
  .m-dark { background:linear-gradient(160deg,#2a2a2e,#121214); } .m-dark i { color:#8e8e93; }
  .m-clear { background:linear-gradient(135deg,#ff9a8b 0%,#a18cd1 45%,#5ec2f2 100%); } .m-clear i { color:rgba(255,255,255,.85); }
  .m-tinted { background:linear-gradient(160deg,#1b2433,#0b0f16); } .m-tinted i { color:#7f9cc4; }
  .ctx { display:flex; flex-direction:column; gap:8px; }
  .dock { padding:8px 10px 6px; border-radius:22px; display:flex; gap:6px; align-items:flex-end;
          background:linear-gradient(135deg,#ffb199 0%,#b9a3e3 50%,#7cc9f0 100%); position:relative; }
  .dock::before { content:""; position:absolute; inset:auto 6px 4px 6px; height:58px; border-radius:18px;
          background:rgba(255,255,255,.35); border:1px solid rgba(255,255,255,.6); backdrop-filter:blur(8px); }
  .dock img { width:56px; position:relative; } .dock img.us { width:64px; margin-bottom:-2px; }
  .finder { width:300px; border-radius:12px; overflow:hidden; border:1px solid #e3e3e8; font-size:12.5px; background:#fff; }
  .finder .fr { display:flex; align-items:center; gap:7px; padding:3px 10px; height:22px; }
  .finder .fr:nth-child(odd) { background:#f6f6f8; }
  .finder .fr.sel { background:#0a64d6; color:#fff; }
  .finder .fr img { width:16px; height:16px; }
  .finder .fr span:last-child { margin-left:auto; color:#8e8e93; } .finder .fr.sel span:last-child { color:#cfe1ff; }
  .spot { width:300px; border-radius:14px; padding:8px 10px; display:flex; gap:10px; align-items:center;
          background:#2b2b2f; color:#f5f5f7; font-size:13px; }
  .spot img { width:32px; height:32px; } .spot small { color:#98989d; display:block; font-size:11px; }
  .pix { display:flex; gap:10px; align-items:flex-start; }
  .pix figure { margin:0; text-align:center; font-size:10.5px; color:var(--mut); }
  .pix canvas { image-rendering:pixelated; border-radius:6px; display:block; background:#e9e9ee; }
  .pix canvas.dk { background:#1c1c1e; }
  footer { color:var(--mut); padding:10px 48px 50px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>macExplorer — Glass Tree refinements</h1>
  <p class="sub">From C1: a single glass folder with a folder tree inside, using Finder-blue folders. R1–R4 vary the tree; all share the same 16/32 px artwork.</p>
</header>
<div class="overview" id="overview"></div>
<div id="cards"></div>
<footer>Source: docs/design/icon-concepts/refine.html — all artwork is generated SVG in this file.</footer>

<script type="module">
// ---------- geometry helpers ----------
const f = v => +v.toFixed(1);
function squircle(x, y, w, h, n = 5) {
  const cx = x + w / 2, cy = y + h / 2, a = w / 2, b = h / 2; let d = '';
  for (let i = 0; i <= 160; i++) {
    const t = i / 160 * 2 * Math.PI, c = Math.cos(t), s = Math.sin(t);
    d += (i ? 'L' : 'M') + f(cx + a * Math.sign(c) * Math.abs(c) ** (2 / n)) + ' ' + f(cy + b * Math.sign(s) * Math.abs(s) ** (2 / n));
  }
  return d + 'Z';
}
const PLATE = squircle(100, 100, 824, 824);
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  return `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x + r}Q${x} ${y + h} ${x} ${y + h - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
}
function folderBack(x, y, w, h, r) {
  const th = h * 0.13, tw = w * 0.36;
  return `M${x} ${y + r}Q${x} ${y} ${x + r} ${y}L${x + tw} ${y}C${x + tw + th * .55} ${y} ${x + tw + th * .45} ${y + th} ${x + tw + th} ${y + th}` +
         `L${x + w - r} ${y + th}Q${x + w} ${y + th} ${x + w} ${y + th + r}L${x + w} ${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}` +
         `L${x + r} ${y + h}Q${x} ${y + h} ${x} ${y + h - r}Z`;
}
const frontY = (y, h) => y + h * 0.27;
const frontCY = (y, h) => y + h * 0.635;
const folderFront = (x, y, w, h, r) => rr(x, frontY(y, h), w, h * 0.73, r);
function mix(a, b, k) {
  if (!a.startsWith('#') || !b.startsWith('#')) return a;
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
}

// ---------- appearance modes ----------
const TINT = '#58a6ff';
function theme(p, mode) {
  const b = { line: p.deep, altA: p.pA, altB: p.pB, ink: '#ffffff', pOpA: 1, pOpB: 1, altOp: 1, glyphOp: 1,
              winA: '#ffffff', winB: p.c2win || '#e6edf7', winOp: .97, traffic: true, ...p };
  if (mode === 'dark') return { ...b, pA: '#3c3f47', pB: '#141518', altA: '#5d6270', altB: '#25282f',
              line: p.lineDark || '#d5dae2', winA: '#34363d', winB: '#202227', winOp: 1,
              ...(p.darkOverride || {}) };
  if (mode === 'clear') return { ...b, pA: '#ffffff', pB: '#ffffff', pOpA: .42, pOpB: .14, altA: '#ffffff', altB: '#ffffff', altOp: .22,
              c1: '#ffffff', c2: '#e3e8ef', acc: '#ffffff', deep: '#6b7785', line: '#ffffff', ink: '#ffffff',
              winA: '#ffffff', winB: '#ffffff', winOp: .45, traffic: false, glyphOp: .95 };
  if (mode === 'tinted') return { ...b, pA: '#25344b', pB: '#0b111b', altA: '#34496c', altB: '#152037',
              c1: TINT, c2: mix(TINT, '#000000', .38), acc: mix(TINT, '#ffffff', .45), deep: mix(TINT, '#000000', .68),
              line: mix(TINT, '#ffffff', .25), ink: mix(TINT, '#ffffff', .75), winA: '#1f2a3b', winB: '#141c29', winOp: 1, traffic: false };
  return b;
}

// ---------- SVG builder ----------
let UID = 0;
function builder() {
  const id = 'u' + (UID++); let n = 0; let defs = '';
  const k = () => id + '_' + (n++);
  return {
    get defs() { return defs; },
    lin(stops, dir = 'v') {
      const key = k(), [x2, y2] = dir === 'h' ? [1, 0] : dir === 'd' ? [1, 1] : [0, 1];
      defs += `<linearGradient id="${key}" x1="0" y1="0" x2="${x2}" y2="${y2}">` +
        stops.map(([o, c, op = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${op}"/>`).join('') + `</linearGradient>`;
      return `url(#${key})`;
    },
    rad(stops, cx = .5, cy = .5, r = .5) {
      const key = k();
      defs += `<radialGradient id="${key}" cx="${cx}" cy="${cy}" r="${r}">` +
        stops.map(([o, c, op = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${op}"/>`).join('') + `</radialGradient>`;
      return `url(#${key})`;
    },
    shadow(dy = 14, sd = 16, op = .3) {
      const key = k();
      defs += `<filter id="${key}" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="${dy}" stdDeviation="${sd}" flood-color="#000" flood-opacity="${op}"/></filter>`;
      return `url(#${key})`;
    },
    glow(sd = 14) {
      const key = k();
      defs += `<filter id="${key}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${sd}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
      return `url(#${key})`;
    },
    clip(d) { const key = k(); defs += `<clipPath id="${key}"><path d="${d}"/></clipPath>`; return `url(#${key})`; },
  };
}

function plateStd(g, t) {
  return `<path d="${PLATE}" fill="${g.lin([[0, t.pA, t.pOpA], [1, t.pB, t.pOpB]])}"/>`;
}
function plateSplit(g, t) {
  const c = g.clip(PLATE);
  return `<g clip-path="${c}"><path d="${PLATE}" fill="${g.lin([[0, t.pA, t.pOpA], [1, t.pB, t.pOpB]])}"/>` +
    `<path d="M0 60L0 1024L964 1024Z" fill="${g.lin([[0, t.altA, t.altOp], [1, t.altB, t.altOp]], 'd')}"/>` +
    `<path d="M0 60L964 1024" stroke="#ffffff" stroke-opacity=".35" stroke-width="4"/></g>`;
}
function plateFinish(g, t) {
  return `<path d="${PLATE}" fill="${g.lin([[0, '#ffffff', .28], [.42, '#ffffff', 0]])}"/>` +
    `<path d="${PLATE}" fill="none" stroke-width="5" stroke="${g.lin([[0, '#ffffff', .75], [.5, '#ffffff', .08], [1, '#ffffff', .3]])}"/>`;
}

function renderSVG(design, mode, small) {
  const g = builder(), t = theme(design.pal, mode);
  const shadowF = g.shadow(12, 16, 1);
  const plate = (design.plate || plateStd)(g, t);
  const art = (small ? design.small : design.hero)(g, t);
  const finish = plateFinish(g, t);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs>${g.defs}</defs>` +
    `<path d="${PLATE}" fill="#000" fill-opacity="${mode === 'clear' ? .12 : .32}" filter="${shadowF}"/>` +
    plate + `<g opacity="${t.glyphOp}">${art}</g>` + finish + `</svg>`;
}
const uri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);

// ---------- reusable fragments ----------
function solidFolder(g, t, x, y, w, h, { shadow = true, r } = {}) {
  r = r ?? Math.min(w, h) * .09;
  const back = g.lin([[0, mix(t.c2, '#ffffff', .05)], [1, mix(t.c2, '#000000', .18)]]);
  const front = g.lin([[0, mix(t.c1, '#ffffff', .38)], [1, t.c1]]);
  const fy = frontY(y, h);
  return `<g ${shadow ? `filter="${g.shadow(16, 20, .28)}"` : ''}>` +
    `<path d="${folderBack(x, y, w, h, r)}" fill="${back}"/>` +
    `<path d="${folderFront(x, y, w, h, r)}" fill="${front}"/>` +
    `<path d="M${x + r} ${fy + 3}H${x + w - r}" stroke="#ffffff" stroke-opacity=".65" stroke-width="5" stroke-linecap="round"/></g>`;
}
function glassFolder(g, t, x, y, w, h, { op = 1, tint, shadow = true, frontOnly = false } = {}) {
  const r = Math.min(w, h) * .09;
  const fb = g.lin([[0, t.ink, .5 * op], [1, t.ink, .16 * op]]);
  const ff = g.lin([[0, t.ink, .88 * op], [1, tint || t.ink, .42 * op]]);
  const rim = g.lin([[0, '#ffffff', .95 * op], [1, '#ffffff', .2 * op]]);
  return `<g ${shadow ? `filter="${g.shadow(18, 24, .22 * op)}"` : ''}>` +
    (frontOnly ? '' : `<path d="${folderBack(x, y, w, h, r)}" fill="${fb}" stroke="${rim}" stroke-width="3"/>`) +
    `<path d="${folderFront(x, y, w, h, r)}" fill="${ff}" stroke="${rim}" stroke-width="4"/></g>`;
}
function chevron(cx, cy, s, sw, color, op = 1) {
  return `<path d="M${cx - s * .45} ${cy - s}L${cx + s * .45} ${cy}L${cx - s * .45} ${cy + s}" fill="none" stroke="${color}" stroke-opacity="${op}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function chevrons(cx, cy, gap, s, sw, color) {
  return chevron(cx - gap, cy, s, sw, color, .45) + chevron(cx, cy, s, sw, color, .7) + chevron(cx + gap, cy, s, sw, color, 1);
}
function streaks(g, t, rows) {
  return rows.map(([x, y, w, h]) => `<path d="${rr(x, y, w, h, h / 2)}" fill="${g.lin([[0, t.ink, 0], [1, t.ink, .9]], 'h')}"/>`).join('');
}
function arrow(L, sh, hw, hl) {
  const a = -L / 2, b = L / 2 - hl;
  return `M${a} ${-sh / 2}L${b} ${-sh / 2}L${b} ${-hw / 2}L${L / 2} 0L${b} ${hw / 2}L${b} ${sh / 2}L${a} ${sh / 2}Z`;
}
function crossArrows(g, t, cx, cy, s, { gap } = {}) {
  const d = arrow(600 * s, 112 * s, 270 * s, 200 * s);
  const fA = g.lin([[0, mix(t.c1, '#ffffff', .35)], [1, t.c1]], 'h');
  const fB = g.lin([[0, mix(t.c2, '#ffffff', .25)], [1, t.c2]], 'h');
  const gapC = gap || t.pB;
  return `<g transform="translate(${cx} ${cy})" filter="${g.shadow(14 * s, 18 * s, .35)}">` +
    `<path d="${d}" transform="rotate(45)" fill="${fB}" stroke="${fB}" stroke-width="${18 * s}" stroke-linejoin="round"/>` +
    `<path d="${d}" transform="rotate(-45)" fill="none" stroke="${gapC}" stroke-width="${54 * s}" stroke-linejoin="round"/>` +
    `<path d="${d}" transform="rotate(-45)" fill="${fA}" stroke="${fA}" stroke-width="${18 * s}" stroke-linejoin="round"/></g>`;
}
function compassRing(g, t, cx, cy, R, { ticks = true, sw = 14 } = {}) {
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${t.line}" stroke-opacity=".9" stroke-width="${sw}"/>`;
  if (ticks) {
    s += `<circle cx="${cx}" cy="${cy}" r="${R - 54}" fill="none" stroke="${t.line}" stroke-opacity=".35" stroke-width="4"/>`;
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * 2 * Math.PI, major = i % 12 === 0, mid = i % 4 === 0;
      const l = major ? 44 : mid ? 28 : 16, w = major ? 12 : mid ? 7 : 4;
      const r1 = R - 14, r2 = r1 - l;
      s += `<line x1="${f(cx + r1 * Math.sin(a))}" y1="${f(cy - r1 * Math.cos(a))}" x2="${f(cx + r2 * Math.sin(a))}" y2="${f(cy - r2 * Math.cos(a))}" stroke="${t.line}" stroke-opacity="${major ? .95 : .6}" stroke-width="${w}" stroke-linecap="round"/>`;
    }
  }
  return s;
}
function needle(g, t, cx, cy, len, hw, rot) {
  const nA = g.lin([[0, mix(t.acc, '#ffffff', .3)], [1, t.acc]], 'h');
  return `<g transform="translate(${cx} ${cy}) rotate(${rot})" filter="${g.shadow(12, 14, .35)}">` +
    `<path d="M0 ${-len}L${hw} 0L0 0Z" fill="${mix(t.acc, '#000000', .18)}"/><path d="M0 ${-len}L${-hw} 0L0 0Z" fill="${nA}"/>` +
    `<path d="M0 ${len}L${hw} 0L0 0Z" fill="${mix(t.line, '#000000', .25)}"/><path d="M0 ${len}L${-hw} 0L0 0Z" fill="${t.line}"/>` +
    `<circle r="${hw * .42}" fill="${t.ink}"/><circle r="${hw * .18}" fill="${t.deep}"/></g>`;
}
function windowCard(g, t, x, y, w, h, r, inner) {
  const fill = g.lin([[0, t.winA, t.winOp], [1, t.winB, t.winOp]]);
  const lights = t.traffic ? ['#ff5f57', '#febc2e', '#28c840'] : [t.line, t.line, t.line];
  const tl = lights.map((c, i) => `<circle cx="${x + 48 + i * 38}" cy="${y + 44}" r="12" fill="${c}" fill-opacity="${t.traffic ? 1 : .5}"/>`).join('');
  return `<g filter="${g.shadow(22, 28, .3)}"><path d="${rr(x, y, w, h, r)}" fill="${fill}" stroke="#ffffff" stroke-opacity=".7" stroke-width="3"/></g>` + tl + inner;
}
function treeLines(t, x, y, rowsY, toX, sw, color) {
  let s = '';
  rowsY.forEach(ry => {
    s += `<path d="M${x} ${y}V${ry - 34}Q${x} ${ry} ${x + 34} ${ry}H${toX}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
  });
  return s;
}
function scissors(g, t, cx, cy, rot, s = 1, color) {
  color = color || t.ink;
  return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${s})" filter="${g.shadow(10, 12, .35)}" stroke="${color}" stroke-linecap="round" fill="none">` +
    `<path d="M14 -24L-180 46" stroke-width="28"/><path d="M14 24L-180 -46" stroke-width="28"/>` +
    `<circle cx="62" cy="-50" r="40" stroke-width="22"/><circle cx="62" cy="50" r="40" stroke-width="22"/>` +
    `<circle cx="-14" cy="0" r="11" fill="${color}" stroke="none"/></g>`;
}
function pill(g, t, x, y, w, h) {
  const fill = g.lin([[0, t.ink, .5], [1, t.ink, .18]]);
  const rim = g.lin([[0, '#ffffff', .95], [1, '#ffffff', .25]]);
  return `<g filter="${g.shadow(18, 22, .25)}"><path d="${rr(x, y, w, h, h / 2)}" fill="${fill}" stroke="${rim}" stroke-width="4"/></g>`;
}
function pillContents(g, t, x, y, h, segs = 2) {
  const cy = y + h / 2; let s = solidFolder(g, t, x + 44, cy - 42, 100, 84, { shadow: false }); let cx = x + 196;
  [130, 104].slice(0, segs).forEach(w => { s += chevron(cx, cy, 26, 18, t.ink) + `<path d="${rr(cx + 40, cy - 20, w, 40, 20)}" fill="${t.ink}" fill-opacity=".9"/>`; cx += 40 + w + 46; });
  return s + `<path d="${rr(cx - 12, cy - 58, 14, 116, 7)}" fill="${t.acc}"/>`;
}

// ---------- palettes ----------
const P = {
  sky:    { pA: '#5ac8fa', pB: '#0a5bd6', c1: '#ffd56b', c2: '#f5a524', acc: '#ffffff', deep: '#9a4f00' },
  indigo: { pA: '#5246c9', pB: '#140f45', c1: '#ffd56b', c2: '#f5a524', acc: '#7fe0ff', deep: '#2a1d6b', line: '#7fe0ff', lineDark: '#7fe0ff' },
  split:  { pA: '#62b8ff', pB: '#1e6fe0', altA: '#50545e', altB: '#1b1d22', c1: '#ffd56b', c2: '#f5a524', acc: '#ffffff', deep: '#9a4f00' },
  metal:  { pA: '#f4f6f9', pB: '#a3abb6', c1: '#ffd56b', c2: '#f5a524', acc: '#ff5a4e', deep: '#2b3038', line: '#2f3540' },
  glass:  { pA: '#38bdf8', pB: '#1e3a8a', c1: '#ffffff', c2: '#bfe9ff', acc: '#7fe0ff', deep: '#1e3a8a' },
  violet: { pA: '#8b7cff', pB: '#2b1d9c', c1: '#ffd56b', c2: '#f5a524', acc: '#ffd56b', deep: '#2b1d9c' },
  ember:  { pA: '#ffa64d', pB: '#e3400b', c1: '#ffffff', c2: '#ffe0c2', acc: '#ffffff', deep: '#7a2200' },
  rush:   { pA: '#22d3ee', pB: '#2563eb', c1: '#ffd56b', c2: '#f5a524', acc: '#ffffff', deep: '#9a4f00' },
  win:    { pA: '#4aa3ff', pB: '#1749c9', c1: '#ffd56b', c2: '#f5a524', acc: '#ffd56b', deep: '#1749c9', line: '#5b77ad', c2win: '#dfe9fb' },
  night:  { pA: '#323846', pB: '#0b0d12', c1: '#5ac8fa', c2: '#ffb340', acc: '#ff5a4e', deep: '#000000', line: '#cfd6e0' },
};

// ---------- designs ----------
const D = [];
const add = (code, name, why, pal, hero, small, plate) => D.push({ code, name, why, pal, hero, small, plate });
// Finder-blue folders inside a single glass folder.
const PR = { pA: '#38bdf8', pB: '#1e3a8a', c1: '#6ec0f5', c2: '#3d93d9', acc: '#bfe9ff', deep: '#1e3a8a', line: '#1e3a8a' };
const GX = 180, GY = 210, GW = 664, GH = 600;               // the glass folder
const glass = (g, t, sh = true) => glassFolder(g, t, GX, GY, GW, GH, { tint: t.acc, shadow: sh }) +
  `<path d="${folderFront(GX + 6, GY, GW - 12, GH - 6, 50)}" fill="${g.lin([[0, t.ink, .55], [1, t.ink, .3]])}"/>`;
const lineC = t => t.deep;
const bar = (t, x, y, w, op = .45) => `<path d="${rr(x, y - 12, w, 24, 12)}" fill="${t.deep}" fill-opacity="${op}"/>`;
const mf = (g, t, x, y, w, h) => solidFolder(g, t, x, y, w, h, { shadow: false });
const smallArt = (g, t) => glass(g, t, false) +
  `<path d="M300 440V690Q300 730 340 730H410M300 560H410" fill="none" stroke="${lineC(t)}" stroke-opacity=".9" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>` +
  mf(g, t, 430, 492, 300, 136) + mf(g, t, 430, 662, 300, 136);
// Export: render one design at an exact pixel size and return a PNG data URL.
window.exportPNG = async (code, px, small) => {
  const d = D.find(x => x.code === code);
  const img = new Image(); img.src = uri(renderSVG(d, 'default', small)); await img.decode();
  const c = document.createElement('canvas'); c.width = c.height = px;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, px, px);
  return c.toDataURL('image/png');
};

add('R1', 'Glass Tree — clean', 'One glass folder; inside, a root folder with three Finder-blue children. No labels: the purest shape.', PR,
  (g, t) => glass(g, t) + `<g transform="translate(150 0)"><path d="M300 490V720Q300 750 330 750H366M300 560H366M300 655H366" fill="none" stroke="${lineC(t)}" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>` +
    mf(g, t, 250, 402, 100, 82) + [560, 655, 750].map(y => mf(g, t, 380, y - 36, 92, 72)).join('') + '</g>',
  smallArt);

add('R2', 'Glass Tree — labelled', 'Same tree with name bars and the middle row selected, like a live sidebar.', PR,
  (g, t) => glass(g, t) + `<path d="${rr(356, 655 - 50, 430, 100, 28)}" fill="${t.pA}" fill-opacity=".28"/>` +
    `<path d="M300 490V720Q300 750 330 750H366M300 560H366M300 655H366" fill="none" stroke="${lineC(t)}" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>` +
    mf(g, t, 250, 402, 100, 82) + bar(t, 372, 443, 210, .55) +
    [560, 655, 750].map((y, i) => mf(g, t, 380, y - 36, 92, 72) + bar(t, 492, y + 2, [230, 190, 150][i])).join(''),

add('R3', 'Glass Tree — nested', 'Two levels deep (root → child → grandchildren) to say “hierarchy” more strongly.', PR,
  (g, t) => glass(g, t) +
    `<g fill="none" stroke="${lineC(t)}" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"><path d="M296 488V722Q296 750 324 750H360M296 560H360"/><path d="M420 604V626Q420 655 448 655H480"/></g>` +
    mf(g, t, 246, 402, 100, 82) + mf(g, t, 372, 526, 96, 74) + mf(g, t, 496, 625, 86, 64) + mf(g, t, 372, 716, 96, 74) +
    bar(t, 488, 563, 200) + bar(t, 600, 657, 150) + bar(t, 488, 753, 170),
  smallArt);

add('R4', 'Glass Tree — tab root', 'The glass folder’s own tab is the root; the trunk drops from it into three larger Finder folders.', PR,
  (g, t) => glass(g, t) + `<path d="M290 300V720Q290 755 325 755H392M290 470H392M290 612H392" fill="none" stroke="${lineC(t)}" stroke-opacity=".6" stroke-width="20" stroke-linecap="round"/>` +
    `<circle cx="290" cy="290" r="22" fill="${t.deep}" fill-opacity=".6"/>` +

// ---------- neighbours for context mocks ----------
const neighbour = (pA, pB, glyph) => ({ pal: { pA, pB, c1: '#fff', c2: '#fff', acc: '#fff', deep: '#000' }, hero: () => glyph, small: () => glyph });
const NB = [
  neighbour('#fdfdfd', '#d9d9de', `<circle cx="512" cy="512" r="210" fill="none" stroke="#ff3b30" stroke-width="60"/>`),
  neighbour('#9be15d', '#00a86b', `<path d="${rr(300, 330, 424, 364, 70)}" fill="#fff"/>`),
  neighbour('#ffcf33', '#ff8a00', `<path d="M300 380H724M300 512H724M300 644H600" stroke="#fff" stroke-width="56" stroke-linecap="round"/>`),
  neighbour('#a0a6b2', '#5d6370', `<circle cx="512" cy="512" r="170" fill="#fff"/>`),
];
const nbImg = (n, m = 'default') => uri(renderSVG(n, m, false));

// ---------- page ----------
async function raster(svg, px) {
  const img = new Image(); img.src = uri(svg); await img.decode();
  const c = document.createElement('canvas'); c.width = c.height = px;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, px, px);
  return c;
}
const ov = document.getElementById('overview'), cards = document.getElementById('cards');
let lastGroup = '';
for (const d of D) {
  const heroD = uri(renderSVG(d, 'default', false));
  ov.insertAdjacentHTML('beforeend', `<a class="ov" href="#${d.code}" style="text-decoration:none"><img src="${heroD}"><b>${d.code}</b> ${d.name.replace(/ \(.*\)/, '')}</a>`);
  const group = d.code[0];
  if (group !== lastGroup) { cards.insertAdjacentHTML('beforeend', `<h2>Variants</h2>`); lastGroup = group; }
  const modes = ['default', 'dark', 'clear', 'tinted'].map(m => `<div class="mode m-${m}"><img src="${uri(renderSVG(d, m, false))}"><i>${m}</i></div>`).join('');
  const small = uri(renderSVG(d, 'default', true));
  const card = document.createElement('section');
  card.className = 'card'; card.id = d.code;
  card.innerHTML = `<h3><span>${d.code}</span>${d.name}</h3><p>${d.why}</p>
    <div class="row">
      <div class="hero"><img src="${heroD}"></div>
      <div class="modes">${modes}</div>
      <div class="ctx">
        <div class="dock"><img src="${nbImg(NB[0])}"><img src="${nbImg(NB[1])}"><img class="us" src="${heroD}"><img src="${nbImg(NB[2])}"><img src="${nbImg(NB[3])}"></div>
        <div class="finder">
          <div class="fr"><img src="${uri(renderSVG(NB[1], 'default', true))}"><span>Calendar.app</span><span>Application</span></div>
          <div class="fr sel"><img src="${small}"><span>macExplorer.app</span><span>Application</span></div>
          <div class="fr"><img src="${uri(renderSVG(NB[2], 'default', true))}"><span>Notes.app</span><span>Application</span></div>
        </div>
        <div class="spot"><img src="${small}"><div>macExplorer<small>Application — Spotlight, 32 pt</small></div></div>
      </div>
      <div class="pix"></div>
    </div>`;
  cards.appendChild(card);
  const pix = card.querySelector('.pix');
  for (const [m, px, label] of [['default', 16, '16 px'], ['default', 32, '32 px'], ['dark', 16, '16 dark'], ['dark', 32, '32 dark']]) {
    const c = await raster(renderSVG(d, m, true), px);
    c.style.width = c.style.height = (px === 16 ? 96 : 96) + 'px';
    if (m === 'dark') c.classList.add('dk');
    const fig = document.createElement('figure'); fig.appendChild(c); fig.insertAdjacentHTML('beforeend', label); pix.appendChild(fig);
  }
}
document.body.dataset.ready = '1';
</script>
